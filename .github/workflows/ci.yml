name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # This workspace is pnpm (pnpm-lock.yaml, lockfileVersion 9). pnpm must be
      # installed BEFORE setup-node, because `cache: 'pnpm'` asks pnpm for its
      # store path. The previous `cache: 'npm'` looked for a package-lock.json
      # that does not exist and failed the job before a single test ran —
      # every run on `main` was red for that reason alone.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: pnpm exec nx record -- pnpm exec nx format:check --base="remotes/origin/main"
      - run: pnpm exec nx run-many -t lint build typecheck e2e

      # `data-access-firestore:test` is excluded here, and only here — its lint,
      # typecheck and build still run above.
      #
      # That suite brings the Firestore emulator up itself (see
      # src/testing/global-setup.ts), which needs the `firebase` CLI on PATH.
      # The CLI is not a workspace dependency, so it exists on developer
      # machines and not on the runner. Until it is installed in CI, those
      # tests run locally only.
      #
      # Know what this costs: those specs are the only coverage of the
      # transactional paths — reserveSpot's capacity/status/price decision,
      # contention behaviour — so a regression there will now reach `main`
      # green. Run `pnpm exec nx test data-access-firestore` before merging
      # anything that touches libs/data-access/firestore.
      - run: pnpm exec nx run-many -t test --exclude=data-access-firestore
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()
